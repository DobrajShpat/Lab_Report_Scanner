[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shpati"
version = "1.0.0"
description = "Unified lab report digitizer combining Lerdi storage and TrustLab clinical safety."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "python-multipart>=0.0.20",
  "pydantic>=2.11.0",
  "opencv-python>=4.12.0",
  "numpy>=2.1.0",
  "orjson>=3.11.0",
  "rapidocr-onnxruntime>=1.2.3,<1.3",
  "pdf2image>=1.17.0",
  "Pillow>=11.0.0",
  "pytest>=8.0.0",
]

[project.scripts]
shpati-api = "api.main:main"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]
